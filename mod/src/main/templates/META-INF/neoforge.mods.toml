modLoader="javafml"
loaderVersion="${neo_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://example.invalid/locomotion-slop/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="First-person rig and animation data: James Pelter (Trainguy9512) - Locomotion, GPLv3. Third-person animations: FreshLX - Fresh Animations Player Add-on (bring your own copy). EMF by Traben, ETF by Traben."
description='''${mod_description}'''

# Mixin config: all mixins are client-side render hooks.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

# Entity Model Features is what actually plays the Fresh Animations Player Add-on
# models/animations. Optional so the mod still loads without it (vanilla third person).
[[dependencies.${mod_id}]]
modId="entity_model_features"
type="optional"
versionRange="[1.0,)"
ordering="AFTER"
side="CLIENT"

# Entity Texture Features: used by EMF for skin/texture variants. Optional.
[[dependencies.${mod_id}]]
modId="entity_texture_features"
type="optional"
versionRange="[1.0,)"
ordering="AFTER"
side="CLIENT"

# The real Locomotion mod renders the same first-person hands; running both would
# double-animate them, so refuse to load together.
[[dependencies.${mod_id}]]
modId="locomotion"
type="incompatible"
reason="Locomotion Slop already contains a port of Locomotion's first-person player animations; installing both makes them fight over the first-person arms."
ordering="NONE"
side="CLIENT"
